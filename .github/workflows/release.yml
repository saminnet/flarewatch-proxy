name: Release

on:
  workflow_run:
    workflows: ['Proxy CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Forks keep their own releases. Only a passing Proxy CI run for a push to main releases.
    if: >-
      github.repository == 'saminnet/flarewatch-proxy' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Find the newest dated version in CHANGELOG.md and check it has no tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # The newest dated section, so an unreleased section merged above it does not hide it.
          HEADING=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)? - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md || true)
          if [[ -z "$HEADING" ]]; then
            echo "CHANGELOG.md has no '## X.Y.Z - YYYY-MM-DD' section. Nothing to release."
            exit 0
          fi

          VERSION=${HEADING#'## '}
          VERSION=${VERSION%% *}
          TAG="v${VERSION}"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]]; then
            echo "${TAG} is already released."
            exit 0
          fi

          if ! grep -qx "const version = \"${VERSION}\"" cmd/flarewatch-proxy/main.go; then
            echo "::error::CHANGELOG.md is at ${VERSION}, but cmd/flarewatch-proxy/main.go has: $(grep 'const version' cmd/flarewatch-proxy/main.go)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: needs.version.outputs.tag
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # The Dockerfile cross-compiles on $BUILDPLATFORM, so arm64 needs no QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        name: Derive image version tags
        env:
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image=ghcr.io/saminnet/flarewatch-proxy
          {
            echo 'tags<<EOF'
            echo "${image}:${version}"
            if [[ "$version" != *-* ]]; then
              echo "${image}:${version%%.*}"
              echo "${image}:${version%.*}"
              echo "${image}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/saminnet/flarewatch-proxy

  release:
    needs: [version, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Tag the commit and publish the CHANGELOG.md section as the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$RUNNER_TEMP/notes.md"
          awk -v heading="## ${TAG#v} - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -E "s#\]\(([^):\#][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" > "$NOTES"

          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "The CHANGELOG.md section for ${TAG#v} is empty."
            exit 1
          fi

          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$NOTES" --prerelease="$prerelease"
