name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    if: ${{ github.repository == 'saminnet/flarewatch-proxy' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check that the tag matches the version in the code
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! grep -qx "const version = \"${TAG#v}\"" cmd/flarewatch-proxy/main.go; then
            echo "::error::The tag is ${TAG}, but cmd/flarewatch-proxy/main.go has: $(grep 'const version' cmd/flarewatch-proxy/main.go)"
            exit 1
          fi
      # The Dockerfile cross-compiles on $BUILDPLATFORM, so arm64 needs no QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        name: Derive image version tags
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image=ghcr.io/saminnet/flarewatch-proxy
          {
            echo 'tags<<EOF'
            echo "${image}:${version}"
            if [[ "$version" != *-* ]]; then
              echo "${image}:${version%%.*}"
              echo "${image}:${version%.*}"
              echo "${image}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/saminnet/flarewatch-proxy
  release:
    # Forks keep their own tags; only the upstream repo publishes releases.
    if: ${{ github.repository == 'saminnet/flarewatch-proxy' }}
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Publish the CHANGELOG.md section as the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$RUNNER_TEMP/notes.md"
          awk -v heading="## ${TAG#v} - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -E "s#\]\(([^):\#][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" > "$NOTES"

          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "CHANGELOG.md has no '## ${TAG#v} - <date>' section with content"
            exit 1
          fi

          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --prerelease="$prerelease"

